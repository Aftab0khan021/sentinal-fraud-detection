version: '3.8'

# ──────────────────────────────────────────────────────
#  YAML Anchor: shared API service definition
# ──────────────────────────────────────────────────────
x-api-service: &api-service
  build:
    context: ./python
    dockerfile: Dockerfile
  environment:
    - ENVIRONMENT=production
    - API_HOST=0.0.0.0
    - API_PORT=8000
    - ALLOWED_ORIGINS=http://localhost:3000,https://localhost
    - REDIS_HOST=redis-master
    - REDIS_PORT=6379
    - REDIS_ENABLED=true
    - REDIS_PASSWORD=${REDIS_PASSWORD:-sentinal_redis_2024}
    - JWT_SECRET_KEY=${JWT_SECRET_KEY:-CHANGE_THIS_IN_PRODUCTION}
    - JWT_REFRESH_SECRET_KEY=${JWT_REFRESH_SECRET_KEY:-CHANGE_THIS_REFRESH}
    - DEMO_USER_HASH=${DEMO_USER_HASH}
    - ADMIN_USER_HASH=${ADMIN_USER_HASH}
    - TRACING_ENABLED=${TRACING_ENABLED:-false}
  volumes:
    - ./python/logs:/app/logs
    - ./python/data:/app/data
    - ./python/models:/app/models
  depends_on:
    redis-master:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - sentinal-net
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s

services:
  # ── NGINX Load Balancer ──────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api-1
      - api-2
      - api-3
    restart: unless-stopped
    networks:
      - sentinal-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── API Instances (3 replicas behind nginx) ──────────
  api-1:
    <<: *api-service
    environment:
      - ENVIRONMENT=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - ALLOWED_ORIGINS=http://localhost:3000,https://localhost
      - REDIS_HOST=redis-master
      - REDIS_PORT=6379
      - REDIS_ENABLED=true
      - REDIS_PASSWORD=${REDIS_PASSWORD:-sentinal_redis_2024}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-CHANGE_THIS_IN_PRODUCTION}
      - JWT_REFRESH_SECRET_KEY=${JWT_REFRESH_SECRET_KEY:-CHANGE_THIS_REFRESH}
      - DEMO_USER_HASH=${DEMO_USER_HASH}
      - ADMIN_USER_HASH=${ADMIN_USER_HASH}
      - INSTANCE_ID=api-1

  api-2:
    <<: *api-service
    environment:
      - ENVIRONMENT=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - ALLOWED_ORIGINS=http://localhost:3000,https://localhost
      - REDIS_HOST=redis-master
      - REDIS_PORT=6379
      - REDIS_ENABLED=true
      - REDIS_PASSWORD=${REDIS_PASSWORD:-sentinal_redis_2024}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-CHANGE_THIS_IN_PRODUCTION}
      - JWT_REFRESH_SECRET_KEY=${JWT_REFRESH_SECRET_KEY:-CHANGE_THIS_REFRESH}
      - DEMO_USER_HASH=${DEMO_USER_HASH}
      - ADMIN_USER_HASH=${ADMIN_USER_HASH}
      - INSTANCE_ID=api-2

  api-3:
    <<: *api-service
    environment:
      - ENVIRONMENT=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - ALLOWED_ORIGINS=http://localhost:3000,https://localhost
      - REDIS_HOST=redis-master
      - REDIS_PORT=6379
      - REDIS_ENABLED=true
      - REDIS_PASSWORD=${REDIS_PASSWORD:-sentinal_redis_2024}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-CHANGE_THIS_IN_PRODUCTION}
      - JWT_REFRESH_SECRET_KEY=${JWT_REFRESH_SECRET_KEY:-CHANGE_THIS_REFRESH}
      - DEMO_USER_HASH=${DEMO_USER_HASH}
      - ADMIN_USER_HASH=${ADMIN_USER_HASH}
      - INSTANCE_ID=api-3

  # ── Frontend ─────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - nginx
    restart: unless-stopped
    networks:
      - sentinal-net

  # ── Redis (Master + 2 Replicas + 3 Sentinels) ────────
  redis-master:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-master-data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-sentinal_redis_2024}
    restart: unless-stopped
    networks:
      - sentinal-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-sentinal_redis_2024}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  redis-replica-1:
    image: redis:7-alpine
    volumes:
      - redis-replica-1-data:/data
    command: >
      redis-server
      --replicaof redis-master 6379
      --requirepass ${REDIS_PASSWORD:-sentinal_redis_2024}
      --masterauth ${REDIS_PASSWORD:-sentinal_redis_2024}
      --appendonly yes
    depends_on:
      redis-master:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sentinal-net

  redis-replica-2:
    image: redis:7-alpine
    volumes:
      - redis-replica-2-data:/data
    command: >
      redis-server
      --replicaof redis-master 6379
      --requirepass ${REDIS_PASSWORD:-sentinal_redis_2024}
      --masterauth ${REDIS_PASSWORD:-sentinal_redis_2024}
      --appendonly yes
    depends_on:
      redis-master:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sentinal-net

  redis-sentinel-1:
    image: redis:7-alpine
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf
      - redis-sentinel-1-data:/data
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    restart: unless-stopped
    networks:
      - sentinal-net

  redis-sentinel-2:
    image: redis:7-alpine
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf
      - redis-sentinel-2-data:/data
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    restart: unless-stopped
    networks:
      - sentinal-net

  redis-sentinel-3:
    image: redis:7-alpine
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf
      - redis-sentinel-3-data:/data
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    restart: unless-stopped
    networks:
      - sentinal-net

  # ── Monitoring ───────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - sentinal-net
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - sentinal-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-SentinAL_Grafana_2024!}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    networks:
      - sentinal-net
    restart: unless-stopped

  # ── Jaeger (OTLP-compatible tracing UI) ─────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC (matches OTEL_EXPORTER_OTLP_ENDPOINT)
      - "4318:4318"     # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    volumes:
      - jaeger-data:/badger
    networks:
      - sentinal-net
    restart: unless-stopped

volumes:
  grafana_data:
  redis-master-data:
  redis-replica-1-data:
  redis-replica-2-data:
  redis-sentinel-1-data:
  redis-sentinel-2-data:
  redis-sentinel-3-data:
  prometheus-data:
  alertmanager-data:
  jaeger-data:

networks:
  sentinal-net:
    driver: bridge
